<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyPattern Control</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>PyPattern ✨</h1>
        <div class="card status-card">
            <h2>Aktuell: <span id="currentPatt">Lade...</span></h2>
            <p>Layout:
                <select id="layoutSelect" onchange="setLayout(this.value)" style="background:var(--bg); color:var(--text); padding:5px; border-radius:5px;">
                    <option>Lade...</option>
                </select>
            </p>
            <div style="margin-top:15px; background:rgba(255,255,255,0.05); padding:10px; border-radius:5px;">
                <p style="margin:0 0 5px 0;">Manuelle Geschwindigkeit:</p>
                <input type="range" id="speedSlider" min="1" max="10" value="9"
                    oninput="updateSpeedLabel(this.value)" onchange="setSpeedUI(this.value)" style="width:100%;">
                <div style="display:flex; justify-content:space-between; font-size:12px; color:#aaa;">
                    <span>Langsam</span><span id="bpmLabel">300 BPM</span><span>Schnell</span>
                </div>
            </div>
        </div>
        <h2>Muster wählen</h2>
        <div id="patternList" class="pattern-list">
            <!-- Wird per JS gefüllt -->
        </div>

        <h2 style="margin-top: 30px;">Playlists</h2>
        <div id="playlistList" class="pattern-list">
            <!-- Wird per JS gefüllt -->
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
