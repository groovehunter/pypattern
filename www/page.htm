<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Controller</title>
  <link href="/www/style.css" rel="stylesheet">
  <link href="file:///home/flow/git-uber/pypattern/www/style.css" rel="stylesheet">
</head>
<body>

  <header>
    <span class="logo">&#11041; Pattern Controller</span>
  </header>

  <!-- STATUS BAR -->
  <section class="status-bar">
    <div class="status-item">
      <span class="label">Track</span>
      <span id="status-track" class="value">&#8211;</span>
    </div>
    <div class="status-item">
      <span class="label">BPM</span>
      <span id="status-bpm" class="value">&#8211;</span>
    </div>
    <div class="status-item wide">
      <span class="label">Pattern</span>
      <span id="status-pattern" class="value">&#8211;</span>
    </div>
  </section>

  <!-- BPM -->
  <section class="card">
    <h2>BPM</h2>
    <div class="bpm-controls">
      <select id="bpm-select" aria-label="BPM Vorauswahl" onchange="applyBpm(this.value)">
        <option value="">&#8211; Vorauswahl &#8211;</option>
        <option value="100">100</option>
        <option value="110">110</option>
        <option value="120">120</option>
        <option value="128">128</option>
        <option value="134">134</option>
        <option value="140">140</option>
        <option value="150">150</option>
        <option value="160">160</option>
        <option value="174">174</option>
        <option value="180">180</option>
        <option value="200">200</option>
        <option value="220">220</option>
        <option value="240">240</option>
        <option value="260">260</option>
      </select>
      <div class="slider-row">
        <span class="slider-label">60</span>
        <input type="range" id="bpm-slider" aria-label="BPM Schieberegler" min="60" max="280" value="120"
               oninput="syncBpmFromSlider(this.value)">
        <span class="slider-label">280</span>
      </div>
      <div class="bpm-input-row">
        <input type="number" id="bpm-input" aria-label="BPM Eingabe" min="60" max="280" value="120"
               oninput="syncBpmFromInput(this.value)">
        <span class="unit">BPM</span>
        <button onclick="applyBpm(document.getElementById('bpm-input').value)">Set</button>
      </div>
    </div>
  </section>

  <!-- PATTERN -->
  <section class="card">
    <h2>Pattern</h2>
    <div class="pattern-grid">
      <ul class="pattern-list" id="pattern-list"></ul>
      <div class="pattern-desc" id="pattern-desc">
        <p class="hint">Wähle ein Pattern aus der Liste.</p>
      </div>
    </div>
  </section>

<script>
const patterns = [
  { name: 'WindmillPattern',
    desc: 'Windmühlen-Rotation: Panels drehen sich sequenziell wie ein Windrad.' },
  { name: 'PairedLightsCycling',
    desc: 'Je zwei gegenüberliegende Lichter wechseln sich im Beat ab.' },
  { name: 'SingleDarkspotCycling',
    desc: 'Ein einzelner dunkler Punkt wandert zyklisch durch alle Positionen.' },
  { name: 'SingleLightCycling',
    desc: 'Ein einzelnes Licht läuft nacheinander durch alle Positionen.' },
  { name: 'SingleLightCyclingLP',
    desc: 'Wie SingleLightCycling, aber mit langem Puls / Fade-Effekt.' },
  { name: 'AllOnOff',
    desc: 'Alle Lichter schalten synchron im Rhythmus an und aus.' },
  { name: 'CyclingPanels',
    desc: 'Panels leuchten der Reihe nach auf – ein Panel pro Beat.' },
  { name: 'Middle_Edge_Cycling',
    desc: 'Mitte und Rand wechseln sich abwechselnd ab.' },
  { name: 'PanelsHorizontalVertical',
    desc: 'Horizontale und vertikale Panelgruppen alternieren.' },
  { name: 'DarkPanelRotationPanelPattern',
    desc: 'Ein dunkles Panel rotiert über die gesamte Fläche.' },
  { name: 'RotationPanelPattern',
    desc: 'Alle Panels rotieren gleichmäßig im Uhrzeigersinn.' },
];

// Pattern-Liste aufbauen
const listEl = document.getElementById('pattern-list');
const descEl = document.getElementById('pattern-desc');

patterns.forEach(p => {
  const li = document.createElement('li');
  const a  = document.createElement('a');
  a.href        = '#';
  a.textContent = p.name;
  a.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('#pattern-list a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    descEl.innerHTML = '<strong>' + p.name + '</strong><p>' + p.desc + '</p>';
    fetch('/pat/' + p.name).catch(() => {});
  });
  li.appendChild(a);
  listEl.appendChild(li);
});

// BPM
function syncBpmFromSlider(v) {
  document.getElementById('bpm-input').value  = v;
  document.getElementById('bpm-select').value = '';
}
function syncBpmFromInput(v) {
  document.getElementById('bpm-slider').value = v;
  document.getElementById('bpm-select').value = '';
}
function applyBpm(v) {
  v = parseInt(v);
  if (!v || v < 60 || v > 280) return;
  document.getElementById('bpm-slider').value = v;
  document.getElementById('bpm-input').value  = v;
  document.getElementById('bpm-select').value = '';
  fetch('/bpm/' + v).catch(() => {});
}

// Status-Polling alle 3s
function refreshStatus() {
  fetch('/status')
    .then(r => r.json())
    .then(d => {
      document.getElementById('status-track').textContent   = d.track   || '\u2013';
      document.getElementById('status-bpm').textContent     = d.bpm ? d.bpm + ' BPM' : '\u2013';
      document.getElementById('status-pattern').textContent = d.pattern || '\u2013';
    })
    .catch(() => {});
}
refreshStatus();
setInterval(refreshStatus, 3000);
</script>

</body>
</html>
